<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Cairo', sans-serif; background:#fff5f8; text-align:center; }
#lockScreen { position:fixed; inset:0; background:#fff5f8; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
#lockScreen input { padding:14px; border-radius:30px; border:2px solid #e91e63; text-align:center; font-size:18px; width:240px; outline:none; margin-top:15px; }
#lockScreen button { margin-top:15px; background:#e91e63; color:white; border:none; padding:12px 40px; border-radius:30px; font-size:18px; cursor:pointer; }
#mainContent { display:none; padding-bottom:40px; }
.message { background:white; width:85%; max-width:500px; margin:20px auto; padding:25px; border-radius:25px; box-shadow:0 8px 20px rgba(0,0,0,0.08); font-size:21px; line-height:1.8; color:#333; }
.counter-box { background:white; width:88%; max-width:500px; margin:20px auto; padding:20px; border-radius:25px; box-shadow:0 8px 20px rgba(233,30,99,0.15); border:2px solid #ffd1dc; }
.timer-grid { display:flex; justify-content:center; gap:10px; margin-top:15px; flex-wrap:wrap; }
.timer-item { background:#e91e63; color:white; padding:10px 12px; border-radius:15px; min-width:60px; }
.timer-item b { display:block; font-size:22px; }
.timer-item span { font-size:12px; }
img { width:90%; max-width:380px; border-radius:20px; margin:12px; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
#playBtn { position:fixed; bottom:20px; right:20px; background:#e91e63; color:white; border:none; width:50px; height:50px; border-radius:50%; font-size:20px; z-index:100; cursor:pointer; }
</style>
</head>
<body>

<div id="lockScreen">
  <div style="font-size:50px;">🔒</div>
  <h2 style="color:#e91e63; margin:10px 0;">خاص بـ لولا فقط</h2>
  <input type="password" id="passInput" placeholder="ادخلي الباسورد">
  <button onclick="checkPass()">دخول</button>
  <p id="wrong" style="color:red; display:none; margin-top:12px;">الباسورد غلط</p>
</div>

<div id="mainContent">
  <button id="playBtn" onclick="document.getElementById('mySong').play()">🎵</button>
  <audio id="mySong" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  
  <h1 style="color:#e91e63; font-size:32px; margin-top:35px;">Happy Birthday Lola 🎂</h1>
  
  <div class="message">
    كل سنه وانتي طيبه ي لولا وعقبال مليون سنه سعيده عليكي<br>
    Happy birthday Toyo 🫶🏻🎉❣️💫
  </div>

  <div class="counter-box">
    <div style="color:#e91e63; font-weight:900; font-size:18px;">لـولا منورة الدنيا بقالها</div>
    <div class="timer-grid">
      <div class="timer-item"><b id="y">0</b><span>سنة</span></div>
      <div class="timer-item"><b id="d">0</b><span>يوم</span></div>
      <div class="timer-item"><b id="h">0</b><span>ساعة</span></div>
      <div class="timer-item"><b id="m">0</b><span>دقيقة</span></div>
      <div class="timer-item"><b id="s">0</b><span>ثانية</span></div>
    </div>
  </div>

  <img src="1.jpg">
  <img src="2.jpg">
  <img src="3.jpg">
  <img src="4.jpg">
</div>

<script>
function checkPass(){
  var input = document.getElementById('passInput').value.trim();
  var secret = atob("MTgxMDIwMTE="); // 18102011 مشفر
  if(input === secret || input === "18-10-2011" || input === "18/10/2011"){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').style.display='block';
    document.getElementById('mySong').play().catch(()=>{});
  } else {
    document.getElementById('wrong').style.display='block';
  }
}
document.getElementById('passInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkPass(); });

var birthDate = new Date("2011-10-18T00:00:00");
function updateTimer(){
  var now = new Date(); var diff = now - birthDate;
  document.getElementById('y').innerText = Math.floor(diff / (1000*60*60*24*365.25));
  document.getElementById('d').innerText = Math.floor(diff / (1000*60*60*24));
  document.getElementById('h').innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  document.getElementById('m').innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
  document.getElementById('s').innerText = Math.floor((diff % (1000*60)) / 1000);
}
setInterval(updateTimer, 1000); updateTimer();
</script>
</body>
</html>
