<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private For Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Cairo', sans-serif; background: linear-gradient(#fff0f5, #ffe4ec); text-align:center; min-height:100vh; }
#lockScreen { position:fixed; inset:0; background:linear-gradient(#fff0f5, #ffe4ec); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#lockScreen input { padding:14px; border-radius:30px; border:2px solid #e91e63; text-align:center; font-size:18px; width:230px; outline:none; }
#lockScreen button { margin-top:15px; background:#e91e63; color:white; border:none; padding:12px 35px; border-radius:30px; font-size:18px; cursor:pointer; }
#mainContent { display:none; padding-bottom:50px; }
.message { background:white; width:85%; max-width:500px; margin:20px auto; padding:20px; border-radius:20px; box-shadow:0 5px 15px rgba(0,0,0,0.1); font-size:20px; line-height:1.8; color:#444; }
#counter { background:#e91e63; color:white; width:90%; max-width:500px; margin:20px auto; padding:15px; border-radius:20px; font-size:18px; }
img { width:90%; max-width:380px; border-radius:20px; margin:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div id="lockScreen">
  <h2 style="color:#e91e63;">🔒 لولا بس اللي تقدر تدخل</h2>
  <p>اكتبي تاريخ ميلادك يا تويو 🎂</p>
  <p style="font-size:13px; opacity:0.7;">مثال: 18102012</p>
  <input type="password" id="passInput" placeholder="تاريخ ميلادك">
  <button onclick="checkPass()">دخول ❤️</button>
  <p id="wrong" style="color:red; display:none; margin-top:10px;">غلط يا لولا، حاولي تاني 🥺</p>
</div>

<div id="mainContent">
  <audio id="mySong" loop>
    <source src="موسيقى.mp3" type="audio/mpeg">
  </audio>
  <h1 style="color:#e91e63; margin-top:30px;">🎂 Happy Birthday Lola 🎂</h1>
  <div class="message">كل سنه وانتي طيبه ي لولا وعقبال مليون سنه سعيده عليكي<br>Happy birthday Toyo 🫶🏻🎉❣️💫</div>
  <div id="counter">لولا منورة الدنيا بقالها<div id="timer" style="font-size:22px; font-weight:bold; margin-top:10px;">...</div><span>منذ 18-10-2012</span></div>
  <img src="1.jpg"><img src="2.jpg"><img src="3.jpg"><img src="4.jpg">
  <div class="message" style="font-size:16px;">من محمد ❤️</div>
</div>

<script>
function checkPass(){
  var input = document.getElementById('passInput').value.trim();
  // الباسورد متشفر ومش هيظهر في الـ View Source
  var secret = atob("MTgxMDIwMTI="); // = 18102012
  if(input === secret){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').style.display='block';
    document.getElementById('mySong').play().catch(()=>{});
  } else {
    document.getElementById('wrong').style.display='block';
  }
}
document.getElementById('passInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkPass(); });

var birthDate = new Date("2012-10-18T00:00:00");
function updateTimer(){
  var now = new Date(); var diff = now - birthDate;
  var years = Math.floor(diff / (1000*60*60*24*365.25));
  var days = Math.floor(diff / (1000*60*60*24));
  var hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  var mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  var secs = Math.floor((diff % (1000*60)) / 1000);
  var el = document.getElementById('timer');
  if(el) el.innerHTML = years + " سنة<br>" + days + " يوم و " + hours + " ساعة و " + mins + " دقيقة و " + secs + " ثانية ❤️";
}
setInterval(updateTimer, 1000); updateTimer();
</script>
</body>
</html>
